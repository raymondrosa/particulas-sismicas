name: Actualizar historial de avisos

on:
  schedule:
    # Cada 10 minutos. GitHub puede retrasar la ejecución unos minutos.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/actualizar_alertas.py"
      - ".github/workflows/actualizar-alertas.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-alertas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar sensores y actualizar alertas.json
        run: python scripts/actualizar_alertas.py

      - name: Guardar cambios si hay avisos nuevos
        run: |
          if git diff --quiet -- alertas.json; then
            echo "Sin cambios en el historial."
            exit 0
          fi
          git config user.name "Observatorio EESE"
          git config user.email "actions@users.noreply.github.com"
          git add alertas.json
          git commit -m "Actualizar historial de avisos"
          git push
