<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Observatorio de Partículas del TOA - Prof. Rosa</title>
    <style>
        /* ============================================================
           OPTIMIZACIÓN PREMIUM - 2 DE AGOSTO DE 2026
           Observatorio de Partículas del TOA - Prof. Raymond Rosa Ávila
           ============================================================ */

        /* Reset optimizado */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Variables CSS para temas y rendimiento */
        :root {
            --bg-overlay: rgba(0, 0, 0, 0.75);
            --bg-card: rgba(0, 0, 0, 0.55);
            --border-glow: rgba(255, 255, 255, 0.2);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --radius: 10px;
            --transition-fast: 0.15s ease;
            --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        html {
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-image: url('fondo.png');
            background-repeat: repeat;
            background-size: auto;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 8px;
            padding-bottom: 50px;
            position: relative;
            background-color: #0a0a12;
            /* Fallback */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== HEADER ===== */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 12px 16px;
            background-color: var(--bg-overlay);
            border-radius: var(--radius);
            margin-bottom: 12px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
            gap: 12px;
        }

        .logo {
            max-width: 110px;
            height: auto;
            border-radius: 6px;
            flex-shrink: 0;
            image-rendering: auto;
        }

        h1 {
            font-family: 'Arial Black', system-ui, Arial, sans-serif;
            font-weight: 900;
            font-size: clamp(1rem, 3.5vw, 2.2rem);
            color: var(--text-primary);
            flex: 1;
            min-width: 160px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .status {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: clamp(0.7rem, 1.2vw, 0.95rem);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .status-circle {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            transition: background-color 0.3s ease;
        }

        /* ===== DATOS EN VIVO ===== */
        .data-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 6px;
            max-width: 1400px;
            margin: 0 auto 12px;
        }

        .data {
            font-size: clamp(0.6rem, 0.9vw, 0.9rem);
            padding: 8px 6px;
            background-color: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            text-align: center;
            word-break: break-word;
            line-height: 1.3;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background-color 0.2s;
        }

        .data:active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* ===== GRÁFICAS ===== */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 10px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .chart-wrapper {
            background: rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 6px;
            border: 1.5px solid var(--border-glow);
            position: relative;
            cursor: pointer;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
            touch-action: manipulation;
        }

        .chart-wrapper:active {
            transform: scale(0.98);
        }

        .chart-wrapper:hover {
            transform: scale(1.01);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .chart-wrapper canvas {
            width: 100% !important;
            height: auto !important;
            max-height: 160px;
            border-radius: 4px;
            background-color: #FFFFFF;
            display: block;
            image-rendering: auto;
        }

        .chart-label {
            color: var(--text-primary);
            text-align: center;
            font-size: clamp(0.6rem, 0.8vw, 0.7rem);
            padding: 3px 0 2px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 4px 4px 0 0;
            margin-bottom: 2px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            font-size: 0.65rem;
        }

        .chart-wrapper .expand-hint {
            position: absolute;
            top: 4px;
            right: 8px;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.35);
            background: rgba(0, 0, 0, 0.6);
            padding: 1px 6px;
            border-radius: 10px;
            pointer-events: none;
            backdrop-filter: blur(2px);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 12px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 14px;
            padding: 12px;
            max-width: 95vw;
            max-height: 95vh;
            width: 1000px;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95);
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-content .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: #fff;
        }

        .modal-content .modal-header h2 {
            font-size: clamp(0.9rem, 1.8vw, 1.2rem);
            margin: 0;
            font-weight: 700;
        }

        .modal-content .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0 10px;
            transition: transform 0.2s;
            line-height: 1;
            touch-action: manipulation;
        }

        .modal-content .modal-close:hover,
        .modal-content .modal-close:active {
            transform: rotate(90deg);
            color: #ff6b6b;
        }

        .modal-content canvas {
            width: 100% !important;
            height: auto !important;
            max-height: 70vh;
            border-radius: 6px;
            background: #FFFFFF;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 12px 10px;
            margin-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: clamp(0.6rem, 0.7vw, 0.75rem);
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius);
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(2px);
        }

        .footer strong {
            color: rgba(255, 255, 255, 0.85);
        }

        /* ===== GRÁFICA COMBINADA ===== */
        .chart-wrapper.combined {
            grid-column: 1 / -1;
            border-color: #FFD700;
        }

        .chart-wrapper.combined canvas {
            max-height: 180px;
        }

        /* ===== RESPONSIVE AVANZADO ===== */
        @media (max-width: 768px) {
            body {
                padding: 5px;
                padding-bottom: 40px;
            }

            .header-row {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 8px;
            }

            .logo {
                max-width: 85px;
            }

            h1 {
                font-size: clamp(0.9rem, 4vw, 1.4rem);
                min-width: auto;
            }

            .status {
                white-space: normal;
                width: 100%;
                justify-content: center;
                font-size: 0.75rem;
                padding: 5px 12px;
            }

            .data-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 4px;
            }

            .data {
                font-size: 0.55rem;
                padding: 5px 3px;
                border-radius: 6px;
            }

            .charts-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }

            .chart-wrapper canvas {
                max-height: 100px;
            }

            .chart-label {
                font-size: 0.5rem;
                padding: 2px 0;
            }

            .chart-wrapper .expand-hint {
                font-size: 0.45rem;
                top: 3px;
                right: 5px;
                padding: 1px 4px;
            }

            .chart-wrapper.combined canvas {
                max-height: 120px;
            }

            .modal-content {
                padding: 8px;
            }

            .modal-content .modal-header h2 {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .data-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 3px;
            }

            .data {
                font-size: 0.5rem;
                padding: 4px 2px;
            }

            .charts-grid {
                grid-template-columns: 1fr 1fr;
                gap: 5px;
            }

            .chart-wrapper canvas {
                max-height: 80px;
            }

            .chart-label {
                font-size: 0.45rem;
            }

            .chart-wrapper.combined canvas {
                max-height: 100px;
            }

            .footer {
                font-size: 0.5rem;
                padding: 8px 6px;
            }
        }

        @media (max-width: 360px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .data-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (min-width: 1200px) {
            .charts-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .chart-wrapper.combined {
                grid-column: 1 / -1;
            }

            .chart-wrapper canvas {
                max-height: 180px;
            }
        }

        /* Soporte para preferencia de movimiento reducido */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Modo oscuro para canvas en gráficas */
        .chart-wrapper canvas {
            background-color: #fafafa;
        }

        /* Mejora de accesibilidad táctil */
        .chart-wrapper,
        .modal-close,
        .data {
            touch-action: manipulation;
        }
    </style>
    <!-- Chart.js optimizado con CDN y defer -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
</head>
<body>

    <!-- ============================================================
    OPTIMIZACIÓN PREMIUM - 29 DE JULIO DE 2026
    Observatorio de Partículas del TOA - Prof. Raymond Rosa Ávila
    ============================================================ -->

    <div class="header-container">
        <div class="header-row">
            <img src="logo.jpg" alt="Logo Observatorio de Partículas del TOA" class="logo" loading="lazy" width="110" height="auto" decoding="async">
            <h1>Observatorio de Partículas del TOA</h1>
            <div class="status" id="stationStatus">
                <span class="status-circle" style="background-color: #FFA500;"></span>
                <span id="statusText">Cargando...</span>
            </div>
        </div>
    </div>

    <!-- Datos en tiempo real -->
    <div class="data-container" id="dataContainer">
        <div class="data" id="realParticles">Partículas Reales: ⏳</div>
        <div class="data" id="imaginaryParticles">Partículas Imag.: ⏳</div>
        <div class="data" id="molecularPhysics">Física Molecular: ⏳</div>
        <div class="data" id="x">Coord. x: ⏳</div>
        <div class="data" id="y">Coord. y: ⏳</div>
        <div class="data" id="z">Coord. z: ⏳</div>
        <div class="data" id="angle">Ángulo: ⏳</div>
        <div class="data" id="accelX">Acel. X: ⏳</div>
        <div class="data" id="accelY">Acel. Y: ⏳</div>
        <div class="data" id="accelZ">Acel. Z: ⏳</div>
        <div class="data" id="accelResult">Acel. Result.: ⏳</div>
    </div>

    <!-- Gráficas -->
    <div class="charts-grid" id="chartsGrid"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="chartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Gráfica</h2>
                <button class="modal-close" id="modalCloseBtn" aria-label="Cerrar">&times;</button>
            </div>
            <canvas id="modalCanvas"></canvas>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <strong>CC-SA Prof. Raymond Rosa Ávila</strong> &bull; Observatorio de Partículas del TOA &bull; 2026
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // OPTIMIZACIÓN PREMIUM - 29 DE JULIO DE 2026
            // ============================================================

            // --- CONFIGURACIÓN IoT ---
            const CHANNEL1 = 2439912;
            const KEY1 = 'BCX6UVTLQZ7VMK4F';
            const CHANNEL2 = 2972050;
            const KEY2 = '8LMMRSTHHX26Z4MI';

            // MÁXIMA CAPTURA DE DATOS: 8000 registros (límite máximo de ThingSpeak)
            // Usamos un rango de 7 días para capturar el máximo histórico posible
            const now = new Date();
            const startDate = new Date(now);
            startDate.setDate(startDate.getDate() - 7);

            const startStr = startDate.toISOString().replace('T', '%20').slice(0, 19);
            const endStr = now.toISOString().replace('T', '%20').slice(0, 19);

            // Solicitar el máximo de registros (8000) y usar el campo 'results' con el máximo permitido
            const URL1 =
                `https://api.thingspeak.com/channels/${CHANNEL1}/feeds.json?api_key=${KEY1}&start=${startStr}&end=${endStr}&results=8000`;
            const URL2 =
                `https://api.thingspeak.com/channels/${CHANNEL2}/feeds.json?api_key=${KEY2}&start=${startStr}&end=${endStr}&results=8000`;

            // --- CONFIGURACIÓN DE GRÁFICAS ---
            const CHART_CONFIGS = [{
                id: 'realParticles',
                label: 'Partículas Reales',
                field: 'field1',
                color: '#36A2EB',
                channel: 1
            }, {
                id: 'imaginaryParticles',
                label: 'Partículas Imag.',
                field: 'field2',
                color: '#FF6384',
                channel: 1
            }, {
                id: 'molecularPhysics',
                label: 'Física Molecular',
                field: 'field3',
                color: '#4BC0C0',
                channel: 1
            }, {
                id: 'xCoord',
                label: 'Coord. x',
                field: 'field4',
                color: '#FF9F40',
                channel: 1
            }, {
                id: 'yCoord',
                label: 'Coord. y',
                field: 'field5',
                color: '#9966FF',
                channel: 1
            }, {
                id: 'zCoord',
                label: 'Coord. z',
                field: 'field6',
                color: '#FFCD56',
                channel: 1
            }, {
                id: 'angle',
                label: 'Ángulo',
                field: 'field7',
                color: '#C9CBCF',
                channel: 1
            }, {
                id: 'accelX',
                label: 'Acel. X',
                field: 'field1',
                color: '#FF5733',
                channel: 2
            }, {
                id: 'accelY',
                label: 'Acel. Y',
                field: 'field2',
                color: '#33FF57',
                channel: 2
            }, {
                id: 'accelZ',
                label: 'Acel. Z',
                field: 'field3',
                color: '#5733FF',
                channel: 2
            }, {
                id: 'accelResult',
                label: 'Acel. Result.',
                field: 'field4',
                color: '#FF33A1',
                channel: 2
            }];

            const DATA_ELEMENTS = {
                realParticles: 'realParticles',
                imaginaryParticles: 'imaginaryParticles',
                molecularPhysics: 'molecularPhysics',
                xCoord: 'x',
                yCoord: 'y',
                zCoord: 'z',
                angle: 'angle',
                accelX: 'accelX',
                accelY: 'accelY',
                accelZ: 'accelZ',
                accelResult: 'accelResult'
            };

            const chartInstances = {};
            let combinedChartInstance = null;
            let isUpdating = false;
            let updateTimeoutId = null;
            let retryTimeoutId = null;

            // --- DECODIFICADOR DE DATOS CON MUESTREO INTELIGENTE ---
            function processFeeds(feeds, field, maxPoints = 500) {
                if (!feeds || feeds.length === 0) return { labels: [], data: [] };

                const result = { labels: [], data: [] };
                const total = feeds.length;

                // Si hay pocos datos, mostrar todos
                if (total <= maxPoints) {
                    for (let i = 0; i < total; i++) {
                        const feed = feeds[i];
                        const val = parseFloat(feed[field]);
                        if (val !== undefined && !isNaN(val)) {
                            result.labels.push(new Date(feed.created_at).toLocaleString());
                            result.data.push(val);
                        }
                    }
                    return result;
                }

                // Muestreo adaptativo: mantener picos y tendencias
                const step = Math.floor(total / maxPoints);
                for (let i = 0; i < total; i += step) {
                    const feed = feeds[i];
                    const val = parseFloat(feed[field]);
                    if (val !== undefined && !isNaN(val)) {
                        result.labels.push(new Date(feed.created_at).toLocaleString());
                        result.data.push(val);
                    }
                }

                // Siempre incluir el último dato
                const last = feeds[total - 1];
                const lastVal = parseFloat(last[field]);
                if (lastVal !== undefined && !isNaN(lastVal)) {
                    const lastLabel = new Date(last.created_at).toLocaleString();
                    if (result.labels.length === 0 || result.labels[result.labels.length - 1] !== lastLabel) {
                        result.labels.push(lastLabel);
                        result.data.push(lastVal);
                    }
                }

                return result;
            }

            // --- CREAR ELEMENTOS DE GRÁFICAS EN EL GRID ---
            function createChartWrappers() {
                const grid = document.getElementById('chartsGrid');
                grid.innerHTML = '';

                CHART_CONFIGS.forEach(cfg => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'chart-wrapper';
                    wrapper.dataset.chartId = cfg.id;

                    const label = document.createElement('div');
                    label.className = 'chart-label';
                    label.textContent = cfg.label;
                    wrapper.appendChild(label);

                    const canvas = document.createElement('canvas');
                    canvas.id = `chart-${cfg.id}`;
                    canvas.width = 300;
                    canvas.height = 150;
                    canvas.setAttribute('loading', 'lazy');
                    wrapper.appendChild(canvas);

                    const hint = document.createElement('span');
                    hint.className = 'expand-hint';
                    hint.textContent = '🔍';
                    wrapper.appendChild(hint);

                    wrapper.addEventListener('click', function(e) {
                        if (e.target.closest('.modal-close') || e.target.closest('.modal-overlay')) return;
                        openModal(cfg.id, cfg.label);
                    }, { passive: true });

                    grid.appendChild(wrapper);
                });

                // Gráfica combinada
                const combinedWrapper = document.createElement('div');
                combinedWrapper.className = 'chart-wrapper combined';
                combinedWrapper.dataset.chartId = 'combined';

                const combinedLabel = document.createElement('div');
                combinedLabel.className = 'chart-label';
                combinedLabel.textContent = '📊 Todas las variables';
                combinedWrapper.appendChild(combinedLabel);

                const combinedCanvas = document.createElement('canvas');
                combinedCanvas.id = 'chart-combined';
                combinedCanvas.width = 600;
                combinedCanvas.height = 200;
                combinedCanvas.setAttribute('loading', 'lazy');
                combinedWrapper.appendChild(combinedCanvas);

                const hintCombined = document.createElement('span');
                hintCombined.className = 'expand-hint';
                hintCombined.textContent = '🔍';
                combinedWrapper.appendChild(hintCombined);

                combinedWrapper.addEventListener('click', function(e) {
                    if (e.target.closest('.modal-close') || e.target.closest('.modal-overlay')) return;
                    openModal('combined', '📊 Todas las variables');
                }, { passive: true });

                grid.appendChild(combinedWrapper);
            }

            // --- MODAL ---
            function openModal(chartId, label) {
                const modal = document.getElementById('chartModal');
                const modalCanvas = document.getElementById('modalCanvas');
                const modalTitle = document.getElementById('modalTitle');

                modalTitle.textContent = label;

                const originalChart = chartId === 'combined' ? combinedChartInstance : chartInstances[chartId];
                if (!originalChart) return;

                const ctx = modalCanvas.getContext('2d');
                if (modalCanvas._chart) {
                    modalCanvas._chart.destroy();
                    modalCanvas._chart = null;
                }

                try {
                    const newChart = new Chart(ctx, {
                        type: 'line',
                        data: JSON.parse(JSON.stringify(originalChart.data)),
                        options: {
                            responsive: true,
                            maintainAspectRatio: true,
                            animation: { duration: 200 },
                            plugins: {
                                legend: {
                                    display: true,
                                    labels: {
                                        color: '#fff',
                                        font: { size: 11 },
                                        boxWidth: 14,
                                        padding: 10
                                    }
                                },
                                tooltip: {
                                    mode: 'index',
                                    intersect: false,
                                    callbacks: {
                                        label: ctx => ctx.parsed.y !== null ? ctx.parsed.y.toFixed(4) :
                                            'N/A'
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    ticks: {
                                        color: '#ccc',
                                        font: { size: 9 },
                                        maxTicksLimit: 20,
                                        maxRotation: 45
                                    },
                                    grid: { color: 'rgba(255,255,255,0.08)' }
                                },
                                y: {
                                    ticks: {
                                        color: '#ccc',
                                        font: { size: 9 }
                                    },
                                    grid: { color: 'rgba(255,255,255,0.08)' },
                                    beginAtZero: false
                                }
                            },
                            elements: {
                                point: {
                                    radius: 2,
                                    hoverRadius: 6
                                }
                            }
                        }
                    });

                    modalCanvas._chart = newChart;
                    modal.classList.add('active');
                    document.body.style.overflow = 'hidden';
                } catch (e) {
                    console.warn('Error en modal:', e);
                }
            }

            function closeModal() {
                const modal = document.getElementById('chartModal');
                modal.classList.remove('active');
                document.body.style.overflow = '';
                const modalCanvas = document.getElementById('modalCanvas');
                if (modalCanvas._chart) {
                    modalCanvas._chart.destroy();
                    modalCanvas._chart = null;
                }
            }

            // Eventos del modal
            document.getElementById('modalCloseBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                closeModal();
            });

            document.getElementById('chartModal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
            });

            // --- ACTUALIZAR DATOS EN VIVO ---
            function updateLiveData(latestFeed1, latestFeed2) {
                const map1 = {
                    realParticles: 'field1',
                    imaginaryParticles: 'field2',
                    molecularPhysics: 'field3',
                    xCoord: 'field4',
                    yCoord: 'field5',
                    zCoord: 'field6',
                    angle: 'field7'
                };
                const map2 = {
                    accelX: 'field1',
                    accelY: 'field2',
                    accelZ: 'field3',
                    accelResult: 'field4'
                };

                Object.keys(map1).forEach(key => {
                    const field = map1[key];
                    const el = document.getElementById(DATA_ELEMENTS[key]);
                    if (el) {
                        const val = latestFeed1 && latestFeed1[field] !== undefined && latestFeed1[field] !==
                            null && latestFeed1[field] !== '' ? latestFeed1[field] : 'En Reposo';
                        el.textContent = `${el.textContent.split(':')[0]}: ${val}`;
                    }
                });

                Object.keys(map2).forEach(key => {
                    const field = map2[key];
                    const el = document.getElementById(DATA_ELEMENTS[key]);
                    if (el) {
                        const val = latestFeed2 && latestFeed2[field] !== undefined && latestFeed2[field] !==
                            null && latestFeed2[field] !== '' ? latestFeed2[field] : 'En Reposo';
                        el.textContent = `${el.textContent.split(':')[0]}: ${val}`;
                    }
                });

                const statusCircle = document.querySelector('.status-circle');
                const statusText = document.getElementById('statusText');
                const isActive = latestFeed1 && latestFeed1.field1 !== undefined && latestFeed1.field1 !== null &&
                    latestFeed1.field1 !== '' && latestFeed1.field1 !== '0';

                if (statusCircle) {
                    statusCircle.style.backgroundColor = isActive ? '#00E676' : '#FF1744';
                }
                if (statusText) {
                    statusText.textContent = isActive ? 'En Monitoreo Activo' : 'En Reposo';
                }
            }

            // --- ACTUALIZAR GRÁFICAS CON MÁXIMA CAPTURA ---
            function updateCharts() {
                if (isUpdating) return;
                isUpdating = true;

                if (updateTimeoutId) {
                    clearTimeout(updateTimeoutId);
                    updateTimeoutId = null;
                }
                if (retryTimeoutId) {
                    clearTimeout(retryTimeoutId);
                    retryTimeoutId = null;
                }

                // Timeout para evitar colgar la UI
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 25000);

                Promise.all([
                    fetch(URL1, { signal: controller.signal }).then(r => r.ok ? r.json() : Promise.reject(
                        'Error canal 1')),
                    fetch(URL2, { signal: controller.signal }).then(r => r.ok ? r.json() : Promise.reject(
                        'Error canal 2'))
                ]).then(([data1, data2]) => {
                    clearTimeout(timeoutId);

                    const feeds1 = data1.feeds || [];
                    const feeds2 = data2.feeds || [];
                    const latestFeed1 = feeds1.length ? feeds1[feeds1.length - 1] : null;
                    const latestFeed2 = feeds2.length ? feeds2[feeds2.length - 1] : null;

                    updateLiveData(latestFeed1, latestFeed2);

                    const combinedDatasets = [];
                    let allLabels = [];

                    // Procesar cada gráfica
                    CHART_CONFIGS.forEach(cfg => {
                        const feeds = cfg.channel === 2 ? feeds2 : feeds1;
                        const { labels, data } = processFeeds(feeds, cfg.field);
                        const canvas = document.getElementById(`chart-${cfg.id}`);
                        if (!canvas) return;
                        const ctx = canvas.getContext('2d');

                        if (chartInstances[cfg.id]) {
                            chartInstances[cfg.id].data.labels = labels;
                            chartInstances[cfg.id].data.datasets[0].data = data;
                            chartInstances[cfg.id].update('none');
                        } else {
                            try {
                                chartInstances[cfg.id] = new Chart(ctx, {
                                    type: 'line',
                                    data: {
                                        labels: labels,
                                        datasets: [{
                                            label: cfg.label,
                                            data: data,
                                            borderColor: cfg.color,
                                            backgroundColor: cfg.color + '33',
                                            borderWidth: 1.5,
                                            pointRadius: 0.5,
                                            pointHoverRadius: 3,
                                            fill: true,
                                            tension: 0.2
                                        }]
                                    },
                                    options: {
                                        responsive: true,
                                        maintainAspectRatio: true,
                                        animation: { duration: 150 },
                                        plugins: {
                                            legend: { display: false },
                                            tooltip: {
                                                mode: 'index',
                                                intersect: false,
                                                callbacks: {
                                                    label: ctx => ctx.parsed.y !== null ? ctx
                                                        .parsed.y.toFixed(4) : 'N/A'
                                                }
                                            }
                                        },
                                        scales: {
                                            x: {
                                                display: true,
                                                ticks: {
                                                    maxTicksLimit: 6,
                                                    font: { size: 6 },
                                                    maxRotation: 25
                                                },
                                                grid: { display: false }
                                            },
                                            y: {
                                                display: true,
                                                ticks: {
                                                    font: { size: 6 },
                                                    callback: value => value.toFixed(2)
                                                },
                                                grid: { color: 'rgba(0,0,0,0.06)' },
                                                beginAtZero: false
                                            }
                                        },
                                        elements: { line: { borderJoinStyle: 'round' } }
                                    }
                                });
                            } catch (e) {
                                console.warn('Error gráfica:', cfg.id, e);
                            }
                        }

                        // Acumular para combinada
                        if (labels.length > 0 && data.length > 0) {
                            if (allLabels.length === 0) {
                                allLabels = labels.slice();
                            }
                            combinedDatasets.push({
                                label: cfg.label,
                                data: data,
                                borderColor: cfg.color,
                                backgroundColor: cfg.color + '22',
                                borderWidth: 1.2,
                                pointRadius: 0.3,
                                fill: false,
                                tension: 0.2
                            });
                        }
                    });

                    // Gráfica combinada
                    const combinedCanvas = document.getElementById('chart-combined');
                    if (combinedCanvas) {
                        const ctxCombined = combinedCanvas.getContext('2d');
                        if (combinedChartInstance) {
                            combinedChartInstance.data.labels = allLabels;
                            combinedChartInstance.data.datasets = combinedDatasets;
                            combinedChartInstance.update('none');
                        } else {
                            try {
                                combinedChartInstance = new Chart(ctxCombined, {
                                    type: 'line',
                                    data: {
                                        labels: allLabels,
                                        datasets: combinedDatasets
                                    },
                                    options: {
                                        responsive: true,
                                        maintainAspectRatio: true,
                                        animation: { duration: 150 },
                                        plugins: {
                                            legend: {
                                                display: true,
                                                labels: {
                                                    color: '#fff',
                                                    font: { size: 7 },
                                                    boxWidth: 10,
                                                    padding: 6
                                                }
                                            },
                                            tooltip: {
                                                mode: 'index',
                                                intersect: false,
                                                callbacks: {
                                                    label: ctx => ctx.parsed.y !== null ?
                                                        `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(4)}` :
                                                        'N/A'
                                                }
                                            }
                                        },
                                        scales: {
                                            x: {
                                                ticks: {
                                                    color: '#ccc',
                                                    font: { size: 6 },
                                                    maxTicksLimit: 10,
                                                    maxRotation: 25
                                                },
                                                grid: { color: 'rgba(255,255,255,0.06)' }
                                            },
                                            y: {
                                                ticks: {
                                                    color: '#ccc',
                                                    font: { size: 6 },
                                                    callback: value => value.toFixed(2)
                                                },
                                                grid: { color: 'rgba(255,255,255,0.06)' },
                                                beginAtZero: false
                                            }
                                        },
                                        elements: {
                                            point: { radius: 0.3, hoverRadius: 3 },
                                            line: { borderJoinStyle: 'round' }
                                        }
                                    }
                                });
                            } catch (e) {
                                console.warn('Error gráfica combinada:', e);
                            }
                        }
                    }

                    isUpdating = false;
                }).catch(error => {
                    clearTimeout(timeoutId);
                    console.warn('Error en actualización:', error);

                    const statusText = document.getElementById('statusText');
                    if (statusText) statusText.textContent = 'Error de conexión';
                    const statusCircle = document.querySelector('.status-circle');
                    if (statusCircle) statusCircle.style.backgroundColor = '#FF1744';

                    isUpdating = false;

                    // Reintentar después de 15 segundos
                    if (retryTimeoutId) clearTimeout(retryTimeoutId);
                    retryTimeoutId = setTimeout(updateCharts, 15000);
                });
            }

            // --- INICIALIZACIÓN ---
            function init() {
                createChartWrappers();

                const checkChart = () => {
                    if (typeof Chart !== 'undefined') {
                        updateCharts();
                        return true;
                    }
                    return false;
                };

                if (document.readyState === 'complete' || document.readyState === 'interactive') {
                    if (!checkChart()) {
                        const interval = setInterval(() => {
                            if (checkChart()) clearInterval(interval);
                        }, 200);
                    }
                } else {
                    document.addEventListener('DOMContentLoaded', () => {
                        if (!checkChart()) {
                            const interval = setInterval(() => {
                                if (checkChart()) clearInterval(interval);
                            }, 200);
                        }
                    });
                }

                // Actualizar cada 20 segundos para datos más frescos
                setInterval(updateCharts, 20000);

                // Actualizar al volver a la pestaña
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) {
                        if (updateTimeoutId) {
                            clearTimeout(updateTimeoutId);
                            updateTimeoutId = null;
                        }
                        updateCharts();
                    }
                }, { passive: true });
            }

            // Iniciar
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
